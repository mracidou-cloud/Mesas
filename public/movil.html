<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0d30">
<title>Find your table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--fondo:#1b0d30;--oro:#d6b46f;--oro2:#f1dca6;--marfil:#f8f2e6;--tinta:#1a2036;--gris:#8a8576;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--sans);background:var(--marfil);color:var(--tinta);min-height:100svh}
  .top{background:radial-gradient(ellipse at 50% 0%,#3a1d63,var(--fondo));color:var(--marfil);text-align:center;padding:34px 24px 54px;
    border-radius:0 0 50% 50% / 0 0 26px 26px}
  .adorno{color:var(--oro);font-size:10px;letter-spacing:.5em;font-weight:600}
  .top h1{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.1;margin-top:8px}
  .wrap{max-width:460px;margin:-30px auto 0;padding:0 18px 40px}
  .card{background:#fff;border-radius:20px;padding:24px 20px;box-shadow:0 10px 40px rgba(20,26,43,.12);border:1px solid #efe6d2}
  .vista{display:none}.vista.on{display:block;animation:ap .45s ease}
  @keyframes ap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h2{font-family:var(--serif);font-weight:600;font-size:26px;text-align:center}
  p.ayuda{text-align:center;color:var(--gris);font-size:14px;margin:6px 0 18px}
  input{width:100%;font:inherit;font-size:18px;padding:15px 16px;border-radius:14px;border:1.5px solid #e3d8c0;background:#fdfaf3;outline:none;color:var(--tinta)}
  input:focus{border-color:var(--oro);box-shadow:0 0 0 4px rgba(214,180,111,.18)}
  ul{list-style:none;margin-top:12px}
  li button{width:100%;text-align:left;font:inherit;font-size:17px;padding:14px 14px;border:0;background:none;border-bottom:1px solid #f0e8d6;color:var(--tinta);display:flex;justify-content:space-between;align-items:center}
  li button::after{content:'›';color:var(--oro);font-size:24px;line-height:1}
  li button:active{background:#fbf5e7}
  .vacio{text-align:center;color:var(--gris);font-size:14px;padding:16px 4px}
  .btn{display:block;width:100%;font:inherit;font-weight:600;font-size:16px;letter-spacing:.04em;padding:16px;border-radius:14px;border:0;margin-top:12px;cursor:pointer}
  .btn.oro{background:linear-gradient(135deg,#e2c482,#c49f55);color:#1a1405;box-shadow:0 6px 18px rgba(196,159,85,.35)}
  .btn.claro{background:none;color:var(--gris);border:1.5px solid #e6dcc6}
  .btn:disabled{opacity:.6}
  .grande{font-family:var(--serif);font-size:30px;font-weight:600;text-align:center;margin:10px 0 6px;line-height:1.15}
  .resultado{text-align:center}
  .hola{font-size:11px;letter-spacing:.4em;color:var(--oro);font-weight:600;text-transform:uppercase}
  .resultado .nombre{font-family:var(--serif);font-size:28px;font-weight:600;margin:6px 0 18px;line-height:1.15}
  .medalla{width:180px;height:180px;margin:0 auto;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,#3d2266,#1b0d30);color:var(--marfil);box-shadow:0 0 0 3px var(--oro),0 0 0 10px rgba(214,180,111,.18),0 18px 40px rgba(14,19,34,.35);
    animation:medalla .9s cubic-bezier(.3,1.6,.5,1)}
  @keyframes medalla{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
  .medalla small{font-size:11px;letter-spacing:.45em;color:var(--oro);font-weight:600;padding-left:.45em}
  .medalla b{font-family:var(--serif);font-weight:500;font-size:88px;line-height:.95;color:var(--oro2)}
  .nmesa{font-family:var(--serif);font-style:italic;font-size:22px;color:#9b7a36;margin-top:16px}
  .mira{margin-top:16px;font-size:14px;color:var(--gris)}
  svg{width:100%;margin-top:18px;background:#1b0d30 url(/fondo.jpg) center/cover;border-radius:14px;padding:8px}
  .m-base{fill:#2a1548;stroke:#9c7a3a;stroke-width:1.2}
  .m-num{font-family:var(--serif);font-size:30px;fill:#e9dcc0;text-anchor:middle;dominant-baseline:central}
  .m-tu .m-base{fill:#d6b46f;stroke:#f1dca6;stroke-width:3}
  .m-tu .m-num{fill:#2a1405;font-weight:600}
  .m-silla{fill:none;stroke:#7a6040;stroke-width:1}
  .m-silla.tu{fill:#f7dc8c;stroke:#fff;stroke-width:3;animation:late 1.2s infinite}
  @keyframes late{50%{opacity:.35}}
  .error{color:#a3352d;text-align:center;font-size:14px;margin-top:10px;min-height:1em}
  .otros{margin-top:18px;font-size:13px;color:var(--gris);text-align:center;line-height:1.7}
  .otros b{color:var(--tinta);font-weight:600}
</style>
</head>
<body>
<div class="top">
  <div class="adorno">✦ WELCOME ✦</div>
  <h1 id="evento">&nbsp;</h1>
</div>
<div class="wrap"><div class="card">

  <section class="vista on" id="v-buscar">
    <h2>Find your table</h2>
    <p class="ayuda">Type your first or last name</p>
    <input id="q" type="search" placeholder="e.g. Emily Carter" autocomplete="off" autocapitalize="words" enterkeyhint="search">
    <ul id="res"></ul>
  </section>

  <section class="vista" id="v-confirmar">
    <p class="ayuda" style="margin-bottom:0">Is this you?</p>
    <div class="grande" id="c-nombre"></div>
    <button class="btn oro" id="si">Yes, that’s me</button>
    <button class="btn claro" id="no">No, search again</button>
    <div class="error" id="err"></div>
  </section>

  <section class="vista resultado" id="v-mesa">
    <div class="hola">Hello</div>
    <div class="nombre" id="r-nombre"></div>
    <div class="medalla"><small>TABLE</small><b id="r-num"></b></div>
    <div class="nmesa" id="r-nmesa"></div>
    <div class="mira">✨ Look at the big screen ✨</div>
    <svg id="mini"></svg>
    <button class="btn claro" id="otro">Check in someone else</button>
    <div class="otros" id="otros"></div>
  </section>

</div></div>

<script src="/plano.js"></script>
<script>
const $ = id => document.getElementById(id);
let cfg, invitados = [], elegido = null;
const CLAVE = 'mesas-registros';
const guardados = () => { try { return JSON.parse(localStorage.getItem(CLAVE)) || []; } catch { return []; } };

function vista(id) { document.querySelectorAll('.vista').forEach(v => v.classList.toggle('on', v.id === id)); scrollTo(0, 0); }

async function iniciar() {
  [cfg, invitados] = await Promise.all([fetch('/api/config').then(r => r.json()), fetch('/api/invitados').then(r => r.json())]);
  $('evento').textContent = cfg.evento; document.title = cfg.evento;
  invitados.forEach(g => g.n = normalizar(g.nombre));
  const prev = guardados();
  if (prev.length) mostrar(prev[prev.length - 1], false);
}

$('q').addEventListener('input', () => {
  const t = normalizar($('q').value).trim().split(/\s+/).filter(Boolean);
  const ul = $('res');
  if (!t.length || t.join('').length < 2) { ul.innerHTML = ''; return; }
  const hits = invitados.filter(g => t.every(p => g.n.split(' ').some(w => w.startsWith(p)) || g.n.includes(p))).slice(0, 8);
  ul.innerHTML = hits.length ? hits.map(g => `<li><button data-id="${g.id}">${esc(g.nombre)}</button></li>`).join('')
    : `<div class="vacio">We couldn’t find that name.<br>Try just your last name, or ask for help at the entrance.</div>`;
});
$('res').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  elegido = invitados.find(g => g.id === b.dataset.id);
  $('c-nombre').textContent = elegido.nombre; $('err').textContent = ''; vista('v-confirmar');
});
$('no').onclick = () => vista('v-buscar');
$('si').onclick = async () => {
  $('si').disabled = true; $('err').textContent = '';
  try {
    const r = await fetch('/api/llegada', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: elegido.id }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error');
    const lista = guardados().filter(x => x.id !== d.id); lista.push(d);
    localStorage.setItem(CLAVE, JSON.stringify(lista));
    mostrar(d, true);
  } catch (e) { $('err').textContent = 'We couldn’t check you in. Check your connection and try again.'; }
  finally { $('si').disabled = false; }
};
$('otro').onclick = () => { $('q').value = ''; $('res').innerHTML = ''; vista('v-buscar'); setTimeout(() => $('q').focus(), 300); };

function mostrar(d, nuevo) {
  $('r-nombre').textContent = d.nombre;
  $('r-num').textContent = d.mesa;
  $('r-nmesa').textContent = d.nombreMesa || cfg.nombresMesas[d.mesa] || '';
  mini(d);
  const otros = guardados().filter(x => x.id !== d.id);
  $('otros').innerHTML = otros.length ? 'Also checked in from this phone:<br>' + otros.map(x => `<b>${esc(x.nombre)}</b> — table ${x.mesa}`).join('<br>') : '';
  vista('v-mesa');
  if (nuevo && navigator.vibrate) navigator.vibrate([60, 40, 60]);
}

function mini(d) {
  const P = calcularEscena(cfg.mesas, cfg.asientos), svg = $('mini');
  svg.setAttribute('viewBox', `0 0 ${P.W} ${P.H}`);
  svg.innerHTML = P.mesas.map(m => {
    const tu = m.numero === d.mesa;
    const sillas = m.sillas.map((s, i) => `<circle class="m-silla ${tu && i === d.asiento ? 'tu' : ''}" cx="${s.x}" cy="${s.y}" r="${P.rSilla * .85}"/>`).join('');
    return `<g class="${tu ? 'm-tu' : ''}"><circle class="m-base" cx="${m.cx}" cy="${m.cy}" r="${P.R}"/><text class="m-num" x="${m.cx}" y="${m.cy}">${m.numero}</text>${sillas}</g>`;
  }).join('');
}

iniciar();
</script>
</body>
</html>
