<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#0e1322; --fondo2:#18203a; --oro:#d6b46f; --oro2:#f1dca6; --marfil:#f6efe0;
    --tenue:rgba(214,180,111,.38); --serif:'Cormorant Garamond',Georgia,serif; --sans:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(ellipse at 35% 30%, var(--fondo2) 0%, var(--fondo) 62%) fixed;
    color:var(--marfil);font-family:var(--sans);
    display:flex;flex-direction:column;height:100vh;
  }
  body::before{ /* textura sutil de estrellas */
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(1px 1px at 12% 18%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff5 50%,transparent 51%),
      radial-gradient(1px 1px at 44% 82%,#fff4 50%,transparent 51%),radial-gradient(1px 1px at 88% 66%,#fff5 50%,transparent 51%),
      radial-gradient(1px 1px at 23% 58%,#fff3 50%,transparent 51%),radial-gradient(1px 1px at 61% 41%,#fff3 50%,transparent 51%);
  }
  #fondo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity 2s;pointer-events:none}
  #fondo-velo{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 40% 45%,rgba(14,19,34,.15),rgba(14,19,34,.65))}
  main,aside{position:relative;z-index:1}
  main{display:flex;flex-direction:column;padding:2.4vh 2vw 1.5vh;min-width:0;flex:1;min-height:0}
  header{text-align:center;margin-bottom:1.5vh}
  .adorno{color:var(--oro);letter-spacing:.6em;font-size:clamp(10px,.8vw,14px);font-weight:500;text-transform:uppercase}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.3vw,70px);line-height:1.05;color:var(--marfil);margin:.6vh 0 .4vh}
  .sub{font-family:var(--serif);font-style:italic;font-size:clamp(16px,1.45vw,28px);color:var(--oro2);opacity:.85}
  .plano{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  svg#mapa{width:100%;height:100%;overflow:visible}

  .mesa-base{fill:url(#gMesa);stroke:var(--oro);stroke-width:1.3}
  .mesa-anillo{fill:none;stroke:var(--tenue);stroke-width:.7;stroke-dasharray:2 3}
  .mesa-num{font-family:var(--serif);font-size:34px;font-weight:500;fill:var(--marfil);text-anchor:middle;dominant-baseline:central}
  .mesa-et{font-family:var(--sans);font-size:7.5px;letter-spacing:3px;fill:var(--oro);text-anchor:middle;font-weight:600}
  .mesa-nom{font-family:var(--serif);font-style:italic;font-size:10px;fill:var(--oro2);text-anchor:middle}
  .mesa-cont{font-family:var(--sans);font-size:7px;fill:var(--marfil);opacity:.55;text-anchor:middle;letter-spacing:1px}
  .mesa.activa .mesa-base{stroke:var(--oro2);stroke-width:2.4;filter:url(#brillo)}
  .mesa.activa .mesa-num{fill:var(--oro2)}
  .mesa.llena .mesa-base{stroke:var(--oro2)}

  .silla circle{fill:rgba(14,19,34,.6);stroke:var(--tenue);stroke-width:1.1;stroke-dasharray:3 2.2;transition:all .4s}
  .silla text{font-family:var(--sans);font-weight:600;fill:var(--fondo);text-anchor:middle;dominant-baseline:central;opacity:0}
  .silla.ocupada circle{fill:url(#gOro);stroke:var(--oro2);stroke-dasharray:none;stroke-width:1}
  .silla.ocupada text{opacity:1}
  .silla.nueva{animation:pop .7s cubic-bezier(.3,1.8,.5,1)}
  .silla{transform-box:fill-box;transform-origin:center}
  @keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.45)}100%{transform:scale(1)}}
  .onda{fill:none;stroke:var(--oro2);stroke-width:2}

  aside{
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
    border-left:1px solid rgba(214,180,111,.25);padding:4.5vh 2vw 3vh;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0
  }
  .qr-titulo{font-family:var(--serif);font-size:clamp(22px,2vw,40px);line-height:1.1;font-weight:500}
  .qr-titulo em{color:var(--oro2)}
  .qr-caja{margin:3vh 0 2vh;padding:clamp(10px,1vw,18px);background:var(--marfil);border-radius:18px;position:relative;
    box-shadow:0 0 0 1px var(--oro),0 0 0 7px rgba(214,180,111,.12),0 20px 60px rgba(0,0,0,.45);width:min(100%,19vw)}
  .qr-caja img{display:block;width:100%;image-rendering:pixelated}
  .qr-pasos{font-size:clamp(11px,.8vw,15px);color:var(--marfil);opacity:.75;line-height:1.7}
  .qr-url{margin-top:1vh;font-size:clamp(9px,.62vw,12px);color:var(--oro);opacity:.7;word-break:break-all}
  .contador{margin-top:3.5vh;width:100%}
  .contador b{font-family:var(--serif);font-weight:500;font-size:clamp(30px,2.6vw,52px);color:var(--oro2)}
  .contador span{font-size:clamp(10px,.75vw,14px);letter-spacing:.2em;text-transform:uppercase;opacity:.7;display:block}
  .barra{height:3px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:1.2vh;overflow:hidden}
  .barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--oro),var(--oro2));transition:width .8s}
  .recientes{margin-top:3vh;width:100%;flex:1;min-height:0;overflow:hidden}
  .recientes ul{-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
  .recientes h3{font-size:clamp(9px,.65vw,12px);letter-spacing:.35em;text-transform:uppercase;color:var(--oro);font-weight:600;margin-bottom:1.2vh}
  .recientes li{list-style:none;display:flex;justify-content:space-between;gap:1vw;padding:.9vh 0;border-bottom:1px solid rgba(214,180,111,.13);
    font-family:var(--serif);font-size:clamp(14px,1.05vw,21px);animation:entra .6s ease}
  .recientes li span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recientes li span:last-child{color:var(--oro2);white-space:nowrap;font-family:var(--sans);font-size:.7em;letter-spacing:.1em;align-self:center}
  @keyframes entra{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  /* animación de bienvenida */
  #velo{position:fixed;inset:0;z-index:5;background:radial-gradient(ellipse at center,rgba(8,11,22,.88),rgba(8,11,22,.55));opacity:0;pointer-events:none}
  #volador{position:fixed;left:50%;top:50%;width:0;height:0;opacity:0;pointer-events:none;z-index:10}
  #volador .in{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap}
  .v-hola{font-size:clamp(12px,1.1vw,22px);letter-spacing:.55em;text-transform:uppercase;color:var(--oro);font-weight:500}
  .v-nombre{font-family:var(--serif);font-weight:500;font-size:clamp(48px,6.2vw,128px);line-height:1.1;color:var(--marfil);
    text-shadow:0 0 40px rgba(241,220,166,.35);margin:1.4vh 0}
  .v-mesa{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.4vw,48px);color:var(--oro2)}
  .v-linea{width:12vw;height:1px;margin:2vh auto 0;background:linear-gradient(90deg,transparent,var(--oro),transparent)}


  /* ---- escenario: video o pareja bailando ---- */
  header{display:flex;flex-direction:column;align-items:center}
  .escenario{position:relative;width:clamp(120px,9vw,180px);aspect-ratio:3/4;margin-bottom:1.2vh;display:none}
  .escenario.on{display:block}
  .arco{position:absolute;inset:0;border-radius:999px 999px 14px 14px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%,#2b3560,#121831 75%);
    box-shadow:0 0 0 1px var(--oro),0 0 0 6px rgba(214,180,111,.12),0 0 40px rgba(214,180,111,.18)}
  .arco video,.arco iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
  .arco iframe{width:300%;left:-100%;pointer-events:none}
  .arco svg{position:absolute;inset:0;width:100%;height:100%}
  .foco{fill:url(#gFoco);animation:foco 4s ease-in-out infinite alternate}
  @keyframes foco{from{opacity:.55}to{opacity:1}}
  .pareja{transform-box:view-box;transform-origin:100px 232px;animation:baile 9s ease-in-out infinite}
  @keyframes baile{
    0%{transform:rotate(-4deg) scaleX(1)} 20%{transform:rotate(4deg) scaleX(1)} 38%{transform:rotate(-3deg) scaleX(1)}
    45%{transform:rotate(0) scaleX(-1)} 65%{transform:rotate(4deg) scaleX(-1)} 83%{transform:rotate(-3deg) scaleX(-1)}
    90%{transform:rotate(0) scaleX(1)} 100%{transform:rotate(-4deg) scaleX(1)}}
  .falda{transform-box:fill-box;transform-origin:50% 0;animation:falda 2.25s ease-in-out infinite alternate}
  @keyframes falda{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
  .velo{transform-box:fill-box;transform-origin:0 0;animation:velo 2.25s ease-in-out infinite alternate}
  @keyframes velo{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
  .corazon{fill:var(--oro2);opacity:0;animation:sube 6s linear infinite}
  @keyframes sube{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-190px) scale(1.1)}}
  .brillo{fill:#fff;animation:titila 2.4s ease-in-out infinite}
  @keyframes titila{0%,100%{opacity:0}50%{opacity:.9}}

  /* ---- título animado ---- */
  h1{position:relative;display:inline-block}
  h1 .l{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(8px);animation:letra .9s cubic-bezier(.2,.8,.2,1) forwards}
  h1 .esp{width:.28em}
  @keyframes letra{to{opacity:1;transform:none;filter:blur(0)}}
  h1::after{content:attr(data-texto);position:absolute;inset:0;color:transparent;pointer-events:none;white-space:nowrap;
    background:linear-gradient(105deg,transparent 42%,rgba(255,236,190,.95) 50%,transparent 58%);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;animation:destello 7s ease-in-out 3s infinite;background-position:150% 0}
  @keyframes destello{0%{background-position:150% 0}35%,100%{background-position:-50% 0}}
  .sub{opacity:0;animation:aparece 1.4s ease forwards}
  .adorno{opacity:0;animation:aparece 1.2s ease .2s forwards}
  @keyframes aparece{to{opacity:.9}}
  .linea-oro{width:0;height:1px;margin:1vh auto 0;background:linear-gradient(90deg,transparent,var(--oro),transparent);animation:crece 1.6s ease forwards}
  @keyframes crece{to{width:min(28vw,520px)}}


  /* ---- centro del anillo: novios + QR + instrucciones ---- */
  #centro{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;align-items:center;justify-content:center;gap:56px;opacity:0;transition:opacity .8s}
  #centro .escenario{width:205px;margin:0;flex:none}
  #centro .qr-caja{margin:0;width:330px;flex:none;padding:16px}
  .qr-texto{width:300px;flex:none;text-align:left}
  .qr-texto .qr-titulo{font-size:46px}
  .qr-texto .qr-pasos{font-size:19px;margin-top:18px}
  .qr-texto .qr-url{font-size:14px;margin-top:14px}
  .qr-texto .flecha{display:block;width:120px;height:1px;margin-top:22px;background:linear-gradient(90deg,var(--oro),transparent)}
  #ayuda{position:fixed;left:16px;bottom:12px;font-size:12px;opacity:.45;transition:opacity 1s}
  #conexion{position:fixed;right:12px;top:10px;font-size:12px;padding:4px 10px;border-radius:20px;background:#a33;display:none}
</style>
</head>
<body>
<video id="fondo" muted loop playsinline autoplay></video>
<div id="fondo-velo" hidden></div>
<main>
  <header>
    <div class="adorno">✦ Seating chart ✦</div>
    <h1 id="evento">&nbsp;</h1>
    <div class="sub" id="subtitulo"></div>
    <div class="linea-oro"></div>
  </header>
  <div class="plano" id="plano">
    <svg id="mapa"></svg>
    <div id="centro">
      <div class="escenario" id="escenario"><div class="arco" id="arco"></div></div>
      <div class="qr-caja"><img id="qr" alt="QR code"></div>
      <div class="qr-texto">
        <div class="qr-titulo">Scan to<br><em>find your table</em></div>
        <div class="qr-pasos">Open your phone camera, point it at the code and look up your name</div>
        <span class="flecha"></span>
        <div class="qr-url" id="url"></div>
      </div>
    </div>
  </div>
</main>

<div id="velo"></div>
<div id="volador"><div class="in"></div></div>
<div id="ayuda">F = full screen · D = simulate an arrival (test)</div>
<div id="conexion">Offline… reconnecting</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/plano.js"></script>
<script>
const NS = 'http://www.w3.org/2000/svg';
let cfg, P, ocupados = new Map(), recientes = [], cola = [], animando = false;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };


const PAREJA = `<svg viewBox="0 0 200 266" aria-hidden="true">
  <defs><radialGradient id="gFoco" cx="50%" cy="85%" r="60%"><stop offset="0" stop-color="#f1dca6" stop-opacity=".35"/><stop offset="1" stop-color="#f1dca6" stop-opacity="0"/></radialGradient>
  <linearGradient id="gSil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e3b0"/><stop offset="1" stop-color="#c79c50"/></linearGradient></defs>
  <ellipse class="foco" cx="100" cy="230" rx="95" ry="120"/>
  <ellipse cx="100" cy="236" rx="58" ry="6" fill="#000" opacity=".35"/>
  <g class="pareja" fill="url(#gSil)">
    <!-- novio -->
    <circle cx="84" cy="62" r="11.5"/>
    <path d="M71 79 Q84 72 98 78 L101 128 Q100 150 97 236 L90 236 L86 152 L82 236 L74 236 Q70 160 70 128 Z"/>
    <path d="M73 82 Q60 92 64 108 Q66 114 72 110 L76 92 Z"/>
    <path d="M97 84 Q108 98 116 104 L113 110 Q100 104 93 94 Z"/>
    <path d="M84 76 L81 86 L84 92 L87 86 Z" fill="#121831" opacity=".6"/>
    <!-- novia -->
    <path class="velo" d="M124 48 Q150 70 152 130 Q140 120 126 70 Z" fill="#fff" opacity=".35"/>
    <circle cx="116" cy="56" r="10.5"/>
    <circle cx="124" cy="48" r="5.5"/>
    <path d="M108 70 Q117 66 125 72 L121 118 L111 118 Z"/>
    <path d="M108 73 Q96 72 88 79 L90 84 Q99 79 110 80 Z"/>
    <path class="falda" d="M109 116 L123 116 Q138 170 158 234 Q140 240 118 236 Q98 241 78 235 Q96 172 109 116 Z"/>
  </g>
  <g>${[[40,250,0],[150,255,1.6],[95,262,3.1],[170,250,4.4],[30,258,2.3]].map(([x,y,d]) =>
    `<path class="corazon" style="animation-delay:${d}s" transform="translate(${x} ${y})" d="M0 3 C-4 -2 -9 1 -6 5 L0 11 L6 5 C9 1 4 -2 0 3Z"/>`).join('')}</g>
  <g>${[[30,40,0],[165,60,.8],[150,25,1.7],[45,110,1.2],[175,140,2]].map(([x,y,d]) =>
    `<circle class="brillo" style="animation-delay:${d}s" cx="${x}" cy="${y}" r="1.6"/>`).join('')}</g>
</svg>`;

function ponerFondo() {
  const v = (cfg.videoFondo || '').trim(), vid = $('fondo');
  if (!v) return;
  vid.src = /^https?:|^\//.test(v) ? v : '/' + v;
  vid.oncanplay = () => { vid.style.opacity = (cfg.opacidadFondo ?? 40) / 100; $('fondo-velo').hidden = false; vid.play().catch(() => {}); };
}
function idYoutube(u) { const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m && m[1]; }
function ponerEscenario() {
  const esc = $('escenario'), arco = $('arco');
  if (cfg.decoracion === false) { esc.classList.remove('on'); return; }
  esc.classList.add('on');
  const v = (cfg.video || '').trim(), yt = idYoutube(v);
  if (yt) arco.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt}?autoplay=1&mute=1&loop=1&playlist=${yt}&controls=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media"></iframe>`;
  else if (v) {
    arco.innerHTML = `<video autoplay muted loop playsinline></video>`;
    const vid = arco.querySelector('video');
    vid.onerror = () => { arco.innerHTML = PAREJA; };
    vid.src = /^https?:|^\//.test(v) ? v : '/' + v;
  }
  else arco.innerHTML = PAREJA;
}
function animarTitulo(texto) {
  const h = $('evento'); h.dataset.texto = texto; h.setAttribute('aria-label', texto);
  h.innerHTML = [...texto].map((c, i) => c === ' ' ? '<span class="l">&nbsp;</span>'
    : `<span class="l" style="animation-delay:${(0.35 + i * 0.06).toFixed(2)}s">${esc(c)}</span>`).join('');
  $('subtitulo').style.animationDelay = (0.6 + texto.length * 0.06) + 's';
}

async function iniciar() {
  cfg = await (await fetch('/api/config')).json();
  animarTitulo(cfg.evento); $('subtitulo').textContent = cfg.subtitulo || ''; ponerEscenario(); ponerFondo();
  document.title = cfg.evento + ' · Seating';
  $('qr').src = cfg.qr; $('url').textContent = cfg.urlMovil.replace(/^https?:\/\//, '');
  dibujar(); ubicarCentro(); document.fonts && document.fonts.ready.then(ubicarCentro);
  await sincronizar();
}

function dibujar() {
  P = calcularAnillo(cfg.mesas, cfg.asientos);
  const svg = $('mapa'); svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${P.W} ${P.H}`);
  svg.innerHTML = `<defs>
    <radialGradient id="gMesa" cx="40%" cy="35%"><stop offset="0" stop-color="#2a3354"/><stop offset="1" stop-color="#151b30"/></radialGradient>
    <radialGradient id="gOro" cx="35%" cy="30%"><stop offset="0" stop-color="#fbedc4"/><stop offset=".55" stop-color="#d6b46f"/><stop offset="1" stop-color="#a9843e"/></radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;
  const fs = Math.max(6, P.rSilla * .68);
  for (const m of P.mesas) {
    const g = el('g', { class: 'mesa', id: `mesa-${m.numero}` }, svg);
    el('circle', { class: 'mesa-anillo', cx: m.cx, cy: m.cy, r: P.R + 8 }, g);
    el('circle', { class: 'mesa-base', cx: m.cx, cy: m.cy, r: P.R }, g);
    const nom = cfg.nombresMesas[m.numero];
    el('text', { class: 'mesa-et', x: m.cx, y: m.cy - 20 }, g).textContent = 'TABLE';
    el('text', { class: 'mesa-num', x: m.cx, y: m.cy + (nom ? -1 : 2) }, g).textContent = m.numero;
    if (nom) el('text', { class: 'mesa-nom', x: m.cx, y: m.cy + 22 }, g).textContent = nom.length > 14 ? nom.slice(0, 13) + '…' : nom;
    el('text', { class: 'mesa-cont', x: m.cx, y: m.cy + (nom ? 34 : 28), id: `cont-${m.numero}` }, g).textContent = `0/${cfg.asientos}`;
    m.sillas.forEach((s, i) => {
      const sg = el('g', { class: 'silla', id: `s-${m.numero}-${i}` }, svg);
      el('circle', { cx: s.x, cy: s.y, r: P.rSilla }, sg);
      el('text', { x: s.x, y: s.y + .5, 'font-size': fs }, sg);
    });
  }
}

async function sincronizar() {
  const lista = await (await fetch('/api/estado')).json();
  for (const g of lista) if (!ocupados.has(g.id)) ocupar(g, false);
  recientes = lista.sort((a, b) => b.hora - a.hora).slice(0, 8);
  pintarRecientes(); contar();
}

function ocupar(g, nueva) {
  ocupados.set(g.id, g);
  const s = $(`s-${g.mesa}-${g.asiento}`);
  if (s) {
    s.classList.add('ocupada'); s.querySelector('text').textContent = iniciales(g.nombre);
    if (nueva) { s.classList.remove('nueva'); void s.getBBox(); s.classList.add('nueva'); onda(s); }
  }
  const n = [...ocupados.values()].filter(x => x.mesa === g.mesa).length;
  const c = $(`cont-${g.mesa}`); if (c) c.textContent = `${n}/${cfg.asientos}`;
  const mesa = $(`mesa-${g.mesa}`); if (mesa) mesa.classList.toggle('llena', n >= cfg.asientos);
}

function onda(s) {
  const c = s.querySelector('circle');
  const o = el('circle', { class: 'onda', cx: c.getAttribute('cx'), cy: c.getAttribute('cy'), r: P.rSilla }, $('mapa'));
  o.animate([{ r: P.rSilla, opacity: 1 }, { r: P.rSilla * 4, opacity: 0 }], { duration: 1100, easing: 'ease-out' }).onfinish = () => o.remove();
}

function contar() {}
function pintarRecientes() {}
// coloca el bloque central (novios + QR) en el hueco del anillo, a la misma escala que el plano
function ubicarCentro() {
  if (!P) return;
  const cont = $('plano').getBoundingClientRect(), svg = $('mapa').getBoundingClientRect();
  const k = Math.min(svg.width / P.W, svg.height / P.H);
  const ox = svg.left - cont.left + (svg.width - P.W * k) / 2, oy = svg.top - cont.top + (svg.height - P.H * k) / 2;
  const c = $('centro');
  c.style.width = P.centro.w + 'px'; c.style.height = P.centro.h + 'px';
  c.style.transform = `translate(${ox + (P.cx - P.centro.w / 2) * k}px,${oy + (P.cy - P.centro.h / 2) * k}px) scale(${k})`;
  c.style.opacity = 1;
}
addEventListener('resize', ubicarCentro);

function encolar(g) { if (ocupados.has(g.id) || cola.some(x => x.id === g.id)) return; cola.push(g); if (!animando) procesar(); }
async function procesar() {
  animando = true;
  while (cola.length) { await animar(cola.shift()); }
  animando = false;
}

async function animar(g) {
  const prisa = cola.length >= 2; // si hay fila, más rápido
  const vol = $('volador'), inner = vol.querySelector('.in'), velo = $('velo');
  const nomMesa = cfg.nombresMesas[g.mesa] ? ` · ${esc(cfg.nombresMesas[g.mesa])}` : '';
  inner.innerHTML = `<div class="v-hola">Welcome</div><div class="v-nombre">${esc(g.nombre)}</div><div class="v-mesa">Table ${g.mesa}${nomMesa}</div><div class="v-linea"></div>`;
  const mesaEl = $(`mesa-${g.mesa}`);
  velo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, fill: 'forwards' });
  await vol.animate([
    { opacity: 0, transform: 'translate(0,30px) scale(.86)', filter: 'blur(10px)' },
    { opacity: 1, transform: 'translate(0,0) scale(1)', filter: 'blur(0)' }
  ], { duration: 800, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }).finished;
  mesaEl && mesaEl.classList.add('activa');
  await sleep(prisa ? 900 : 2000);

  const destino = $(`s-${g.mesa}-${g.asiento}`) || mesaEl;
  const r = destino.getBoundingClientRect();
  const dx = r.left + r.width / 2 - innerWidth / 2, dy = r.top + r.height / 2 - innerHeight / 2;
  velo.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1100, fill: 'forwards', delay: 200 });
  await vol.animate([
    { opacity: 1, transform: 'translate(0,0) scale(1)' },
    { opacity: 1, transform: `translate(${dx * .35}px,${dy * .35 - 60}px) scale(.55)`, offset: .4 },
    { opacity: .9, transform: `translate(${dx}px,${dy}px) scale(.06)` }
  ], { duration: prisa ? 900 : 1300, easing: 'cubic-bezier(.55,0,.35,1)', fill: 'forwards' }).finished;
  vol.animate([{ opacity: .9 }, { opacity: 0 }], { duration: 150, fill: 'forwards' });

  ocupar(g, true);
  recientes.unshift(g); recientes = recientes.slice(0, 8); pintarRecientes(); contar();
  await sleep(prisa ? 500 : 1100);
  mesaEl && mesaEl.classList.remove('activa');
}

// ---- tiempo real ----
const socket = io();
socket.on('llegada', encolar);
socket.on('reinicio', () => location.reload());
socket.on('connect', () => { $('conexion').style.display = 'none'; if (cfg) sincronizar(); });
socket.on('disconnect', () => { $('conexion').style.display = 'block'; });

// ---- teclado ----
let demoN = 0;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (k === 'd') { // simulación local: no guarda nada
    const m = 1 + Math.floor(Math.random() * cfg.mesas);
    const libres = [...Array(cfg.asientos).keys()].filter(i => ![...ocupados.values()].some(x => x.mesa === m && x.asiento === i));
    if (!libres.length) return;
    encolar({ id: 'demo' + (++demoN), nombre: ['Test Guest', 'Emily Carter', 'James Walker', 'Sophia Bennett'][demoN % 4], mesa: m, asiento: libres[0], hora: Date.now() });
  }
});
setTimeout(() => $('ayuda').style.opacity = 0, 8000);
// mantener la pantalla encendida si el navegador lo permite
if ('wakeLock' in navigator) { const pedir = () => navigator.wakeLock.request('screen').catch(() => {}); pedir(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && pedir()); }

iniciar();
</script>
