<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Diseño "Soft clay": crema, pastel, todo redondito con volumen ===== */
  :root{
    --crema:#f7efe3; --tarjeta:#fdf8f0; --cafe:#4b3428; --cafe2:#8a6b58;
    --salvia:#a8c9ae; --salvia2:#5f8f6e; --durazno:#f6bfa8; --coral:#ef8a6a; --mantequilla:#f7d98f; --azul:#b3cbe3; --lila:#d9bfdc;
    --sombra:0 22px 40px rgba(122,88,58,.16),0 6px 12px rgba(122,88,58,.10),inset 0 3px 0 rgba(255,255,255,.85),inset 0 -8px 16px rgba(122,88,58,.08);
    --redonda:'Fredoka','Nunito',system-ui,sans-serif; --sans:'Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--crema)}
  body{color:var(--cafe);font-family:var(--sans)}
  #escena{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
  #bg{position:absolute;inset:0;background:
      radial-gradient(ellipse 60% 50% at 18% 12%,#fff8ee 0,transparent 70%),
      radial-gradient(ellipse 50% 45% at 85% 90%,#f4e3d2 0,transparent 70%),
      linear-gradient(160deg,#f9f2e8,#f3e8da)}
  #fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 2s;pointer-events:none}
  svg#mapa{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}

  /* Título */
  .titulo{position:absolute;left:66px;top:44px;width:580px}
  .adorno{display:inline-flex;align-items:center;gap:8px;padding:7px 16px 7px 12px;border-radius:30px;background:var(--tarjeta);box-shadow:var(--sombra);
    font-weight:800;font-size:15px;color:var(--salvia2);letter-spacing:.04em;opacity:0;animation:aparece 1.2s ease .2s forwards}
  h1{position:relative;display:inline-block;font-family:var(--redonda);font-weight:600;font-size:64px;line-height:1.05;margin:16px 0 6px;color:var(--cafe);opacity:0}
  h1::after{content:attr(data-texto);position:absolute;inset:0;color:transparent;pointer-events:none;
    background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;background-position:150% 0}
  .sub{font-size:24px;font-weight:700;color:var(--cafe2);opacity:0;animation:aparece 1.4s ease forwards}
  .linea-oro{display:none}
  @keyframes aparece{to{opacity:1}}

  /* Tarjeta del QR (centro) */
  #qr-rombo{position:absolute;left:960px;top:540px;width:384px;height:448px;margin:-224px 0 0 -192px;border-radius:44px;background:var(--tarjeta);
    box-shadow:var(--sombra);padding:22px 30px 30px;display:flex;flex-direction:column;align-items:center;animation:latido 1s ease-out infinite}
  #qr-rombo .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:30px;background:var(--salvia);color:#fff;
    font-family:var(--redonda);font-weight:600;font-size:21px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 8px rgba(60,100,70,.2),0 6px 12px rgba(95,143,110,.25);margin-bottom:18px}
  #qr-rombo .qr-in{flex:1;width:100%;border-radius:26px;background:#fff;padding:16px;box-shadow:inset 0 3px 10px rgba(122,88,58,.12)}
  #qr-rombo img{display:block;width:100%;height:100%;image-rendering:pixelated}
  @keyframes latido{0%{box-shadow:var(--sombra),0 0 0 0 rgba(239,138,106,.0)}25%{box-shadow:var(--sombra),0 0 0 6px rgba(239,138,106,.18)}100%{box-shadow:var(--sombra),0 0 0 0 rgba(239,138,106,0)}}

  /* Pulso + confeti pastel alrededor del QR */
  #halo{position:absolute;left:960px;top:540px;width:0;height:0;pointer-events:none}
  .resplandor{position:absolute;left:-380px;top:-380px;width:760px;height:760px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,236,214,.95) 0%,rgba(246,191,168,.35) 38%,rgba(246,191,168,0) 64%);animation:resplandor 1s ease-out infinite}
  @keyframes resplandor{0%{opacity:1;transform:scale(.92)}100%{opacity:.45;transform:scale(1.08)}}
  .pulso{position:absolute;left:-192px;top:-224px;width:384px;height:448px;border-radius:46px;border:4px solid rgba(239,138,106,.75);
    box-shadow:0 0 22px rgba(239,138,106,.45);animation:pulso 1s cubic-bezier(.2,.6,.3,1) infinite}
  @keyframes pulso{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.3);opacity:0}}
  .bokeh{position:absolute;border-radius:50%;animation:deriva var(--d) ease-in-out infinite alternate}
  .bokeh i{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),var(--c) 55%,var(--c2) 100%);
    box-shadow:0 4px 8px rgba(122,88,58,.18);animation:salta 1s ease-in-out infinite;animation-delay:var(--r)}
  @keyframes salta{0%,100%{transform:scale(.85)}22%{transform:scale(1.12)}}
  @keyframes deriva{to{transform:translate(var(--x),var(--y))}}

  /* Decoraciones de plastilina */
  .deco{position:absolute;pointer-events:none;animation:flota var(--t,6s) ease-in-out infinite alternate}
  @keyframes flota{from{transform:translateY(0) rotate(var(--a,0deg))}to{transform:translateY(-12px) rotate(calc(var(--a,0deg) * -1))}}

  /* Instrucciones / mural — abajo a la derecha */
  .instrucciones{position:absolute;left:40px;top:236px;width:390px;height:118px;border-radius:34px;
    background:linear-gradient(135deg,#b7d4bc,#9ec2a6);box-shadow:0 22px 40px rgba(95,143,110,.25),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -8px 16px rgba(60,100,70,.15);
    display:flex;align-items:center;gap:18px;padding:0 28px 0 18px;color:#fff}
  .instrucciones svg{flex:none}
  .instrucciones .t{font-family:var(--redonda);font-weight:600;font-size:26px;line-height:1.1;text-shadow:0 2px 4px rgba(60,100,70,.25)}
  .instrucciones .p{font-size:16px;font-weight:700;opacity:.95;margin-top:4px}
  .instrucciones .u{display:none}

  /* Mesas */
  .mesa-et{font-family:var(--sans);font-weight:800;letter-spacing:2.5px;fill:var(--cafe2);text-anchor:middle;opacity:.8}
  .mesa-num{font-family:var(--redonda);font-weight:600;fill:var(--cafe);text-anchor:middle;dominant-baseline:central}
  .mesa-nom{font-family:var(--sans);font-weight:800;fill:var(--cafe2);text-anchor:middle}
  .mesa-cont{font-family:var(--sans);font-weight:800;fill:var(--cafe2);opacity:.75;text-anchor:middle}
  .mesa{transform-box:fill-box;transform-origin:center}
  .mesa.activa .mesa-base{stroke:#fff;stroke-width:4}
  .silla circle{transition:all .4s}
  .silla text{font-family:var(--redonda);font-weight:600;fill:var(--cafe);text-anchor:middle;dominant-baseline:central;opacity:0}
  .silla.ocupada text{opacity:1}
  .silla{transform-box:fill-box;transform-origin:center}
  .silla.nueva{animation:pop .7s cubic-bezier(.3,1.8,.5,1)}
  @keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.45)}100%{transform:scale(1)}}
  .onda{fill:none;stroke:var(--coral);stroke-width:3}
  .haz{fill:none;stroke-linecap:round;pointer-events:none}

  /* Mural de deseos: columnas */
  .columna{position:absolute;right:10px;top:0;bottom:0;width:430px;overflow:hidden;pointer-events:none;
    -webkit-mask-image:linear-gradient(transparent,#000 90px,#000 calc(100% - 90px),transparent);mask-image:linear-gradient(transparent,#000 90px,#000 calc(100% - 90px),transparent)}
  .slot{position:absolute;right:14px;top:0;width:270px;height:90px;transform-origin:100% 50%;will-change:transform}
  .slot .nota{width:100%;height:100%}
  .nota{position:relative;width:270px;height:90px;flex:none;display:flex;flex-direction:column;padding:8px 14px 6px;border-radius:24px;
    background:var(--tarjeta);box-shadow:0 12px 22px rgba(122,88,58,.14),inset 0 2px 0 rgba(255,255,255,.9),inset 0 -5px 10px rgba(122,88,58,.07)}
  .nota img{display:block;width:100%;flex:1;min-height:0;object-fit:contain}
  .nota span{display:block;font-size:11px;font-weight:800;color:var(--cafe2);text-align:center;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nota span{text-align:right}
  .nota.nueva{animation:notaPop .8s cubic-bezier(.2,1.25,.3,1)}
  @keyframes notaPop{from{transform:scale(.3);opacity:0}}
  .costura{position:absolute;left:14%;right:14%;bottom:0;height:3px;border-radius:3px;background:var(--coral);box-shadow:0 0 8px rgba(239,138,106,.6);transform:scaleX(0);pointer-events:none}

  /* Luz de seguimiento: aclara la mesa y oscurece suavemente lo demás */
  @property --fx{syntax:'<length>';inherits:false;initial-value:960px}
  @property --fy{syntax:'<length>';inherits:false;initial-value:540px}
  @property --fr{syntax:'<number>';inherits:false;initial-value:1}
  #foco{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;
    background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,255,255,.55) 0,rgba(255,250,240,.2) calc(var(--fr)*115px),rgba(90,64,40,0) calc(var(--fr)*190px),rgba(90,64,40,.24) calc(var(--fr)*440px))}

  /* Bienvenida: tarjeta de plastilina sobre un velo crema esmerilado */
  #velo{position:absolute;inset:0;z-index:5;background:rgba(247,239,227,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none}
  #volador{position:fixed;left:50%;top:50%;width:0;height:0;opacity:0;pointer-events:none;z-index:10}
  #volador .in{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;background:var(--tarjeta);border-radius:clamp(28px,3vw,56px);
    padding:clamp(22px,2.6vw,50px) clamp(40px,5vw,96px);box-shadow:0 40px 80px rgba(122,88,58,.22),0 10px 20px rgba(122,88,58,.12),inset 0 4px 0 #fff,inset 0 -12px 24px rgba(122,88,58,.08)}
  .v-hola{font-size:clamp(14px,1.3vw,26px);font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--coral)}
  .v-nombre{font-family:var(--redonda);font-weight:600;font-size:clamp(46px,5.6vw,112px);line-height:1.1;color:var(--cafe);margin:1vh 0 1.4vh}
  .v-mesa{display:inline-block;font-family:var(--redonda);font-weight:600;font-size:clamp(20px,2.1vw,42px);color:var(--cafe);padding:.25em .9em;border-radius:40px;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -6px 10px rgba(122,88,58,.12),0 8px 16px rgba(122,88,58,.14)}
  .v-linea{display:none}
  .v-deseo{display:block;margin:1.5vh auto 0;max-width:56vw;max-height:40vh}

  #ayuda{position:fixed;left:16px;bottom:10px;font-size:12px;opacity:.5;transition:opacity 1s;z-index:20}
  #conexion{position:fixed;right:12px;top:10px;font-size:12px;padding:4px 10px;border-radius:20px;background:#d9534f;color:#fff;display:none;z-index:20}
</style>
</head>
<body>
<div id="escena">
  <div id="bg"></div>
  <video id="fondo" muted loop playsinline autoplay></video>

  <!-- Decoraciones: corazones, estrella sonriente y maceta (dibujos originales) -->
  <svg class="deco" style="left:760px;top:56px;--t:5.5s;--a:-6deg" width="120" height="110" viewBox="0 0 120 110"><defs>
    <radialGradient id="dCor" cx="35%" cy="30%"><stop offset="0" stop-color="#ffd2c4"/><stop offset=".55" stop-color="#f29b7f"/><stop offset="1" stop-color="#d97558"/></radialGradient></defs>
    <ellipse cx="60" cy="104" rx="30" ry="5" fill="rgba(122,88,58,.12)"/>
    <path d="M60 96 C18 66 8 44 20 26 C32 9 52 13 60 30 C68 13 88 9 100 26 C112 44 102 66 60 96Z" fill="url(#dCor)"/>
    <ellipse cx="38" cy="32" rx="12" ry="7" fill="#fff" opacity=".55" transform="rotate(-30 38 32)"/></svg>
  <svg class="deco" style="left:1110px;top:150px;--t:6.5s;--a:8deg" width="70" height="66" viewBox="0 0 120 110">
    <path d="M60 96 C18 66 8 44 20 26 C32 9 52 13 60 30 C68 13 88 9 100 26 C112 44 102 66 60 96Z" fill="url(#dCor)" opacity=".9"/>
    <ellipse cx="38" cy="32" rx="12" ry="7" fill="#fff" opacity=".55" transform="rotate(-30 38 32)"/></svg>
  <svg class="deco" style="left:800px;top:880px;--t:5s;--a:5deg" width="150" height="150" viewBox="0 0 150 150"><defs>
    <radialGradient id="dEst" cx="40%" cy="35%"><stop offset="0" stop-color="#fff3c4"/><stop offset=".6" stop-color="#f7d27a"/><stop offset="1" stop-color="#e0ac45"/></radialGradient></defs>
    <ellipse cx="75" cy="142" rx="38" ry="6" fill="rgba(122,88,58,.12)"/>
    <path d="M75 12 Q84 12 88 30 L95 50 Q98 56 105 56 L126 57 Q140 59 132 70 L115 84 Q110 89 112 95 L119 117 Q123 132 110 125 L83 108 Q75 104 67 108 L40 125 Q27 132 31 117 L38 95 Q40 89 35 84 L18 70 Q10 59 24 57 L45 56 Q52 56 55 50 L62 30 Q66 12 75 12Z"
      fill="url(#dEst)" stroke="#e8b85a" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="66" cy="74" rx="4" ry="5.5" fill="#4b3428"/><ellipse cx="86" cy="74" rx="4" ry="5.5" fill="#4b3428"/>
    <path d="M68 86 Q76 93 84 86" fill="none" stroke="#4b3428" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="57" cy="85" rx="6" ry="3.5" fill="#f29b7f" opacity=".6"/><ellipse cx="95" cy="85" rx="6" ry="3.5" fill="#f29b7f" opacity=".6"/>
    <ellipse cx="62" cy="40" rx="7" ry="4" fill="#fff" opacity=".6" transform="rotate(-25 62 40)"/></svg>
  <svg class="deco" style="left:1000px;top:905px;--t:7s;--a:-3deg" width="120" height="150" viewBox="0 0 120 150"><defs>
    <radialGradient id="dHoja" cx="35%" cy="30%"><stop offset="0" stop-color="#cfe5d2"/><stop offset=".6" stop-color="#93bb9b"/><stop offset="1" stop-color="#6e9d79"/></radialGradient>
    <linearGradient id="dMac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf1e2"/><stop offset="1" stop-color="#e9d7bf"/></linearGradient></defs>
    <ellipse cx="60" cy="144" rx="34" ry="5" fill="rgba(122,88,58,.14)"/>
    <ellipse cx="38" cy="50" rx="16" ry="34" fill="url(#dHoja)" transform="rotate(-28 38 50)"/>
    <ellipse cx="82" cy="50" rx="16" ry="34" fill="url(#dHoja)" transform="rotate(28 82 50)"/>
    <ellipse cx="60" cy="38" rx="15" ry="36" fill="url(#dHoja)"/>
    <path d="M28 88 H92 L84 138 Q83 142 78 142 H42 Q37 142 36 138Z" fill="url(#dMac)"/>
    <rect x="24" y="82" width="72" height="14" rx="7" fill="#f6e8d4"/>
    <ellipse cx="44" cy="104" rx="5" ry="10" fill="#fff" opacity=".5"/></svg>

  <svg id="mapa"></svg>
  <div class="columna" id="mural"></div>

  <div class="titulo">
    <div class="adorno">💛 Seating chart</div>
    <h1 id="evento">&nbsp;</h1>
    <div class="sub" id="subtitulo"></div>
    <div class="linea-oro"></div>
  </div>

  <div id="halo"><div class="resplandor"></div><div class="pulso"></div></div>
  <div id="qr-rombo"><div class="chip">📱 Scan me!</div><div class="qr-in"><img id="qr" alt="QR code"></div></div>

  <div class="instrucciones">
    <svg width="80" height="80" viewBox="0 0 150 150"><path d="M75 12 Q84 12 88 30 L95 50 Q98 56 105 56 L126 57 Q140 59 132 70 L115 84 Q110 89 112 95 L119 117 Q123 132 110 125 L83 108 Q75 104 67 108 L40 125 Q27 132 31 117 L38 95 Q40 89 35 84 L18 70 Q10 59 24 57 L45 56 Q52 56 55 50 L62 30 Q66 12 75 12Z" fill="url(#dEst)" stroke="#e8b85a" stroke-width="2"/>
      <ellipse cx="66" cy="74" rx="4" ry="5.5" fill="#4b3428"/><ellipse cx="86" cy="74" rx="4" ry="5.5" fill="#4b3428"/><path d="M68 86 Q76 93 84 86" fill="none" stroke="#4b3428" stroke-width="3" stroke-linecap="round"/></svg>
    <div><div class="t" id="banner-t">Find your table ✨</div><div class="p" id="banner-p">Scan the code in the center and look up your name</div><div class="u" id="url"></div></div>
  </div>
  <div id="foco"></div>
  <div id="velo"></div>
</div>

<div id="volador"><div class="in"></div></div>
<div id="ayuda">F = full screen · D = simulate an arrival (test)</div>
<div id="conexion">Offline… reconnecting</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/plano.js"></script>
<script>
const NS = 'http://www.w3.org/2000/svg';
const DISENO = 'clay';   // id de este diseño (para sus posiciones guardadas)
let cfg, P, ocupados = new Map(), cola = [], animando = false;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const ruta = v => /^https?:|^\//.test(v) ? v : '/' + v;

// ---- escala del escenario 1920x1080 a la pantalla ----
function escalar() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  const e = $('escena');
  e.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px,${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', escalar); escalar();

// Curvas de movimiento (tomadas de las recetas de video-shotcraft)
const EXPO = 'cubic-bezier(.16,1,.3,1)';          // salida suave, para revelar
const SOBRE = 'cubic-bezier(.2,1.25,.3,1)';       // subida con rebote (spotlight-hero-card)
const ACELERA = 'cubic-bezier(.55,0,.25,1)';      // vuelo que acelera y frena al llegar
const ENTRA_SALE = 'cubic-bezier(.45,0,.2,1)';

function animarTitulo(texto) {
  const h = $('evento'); h.dataset.texto = texto; h.textContent = texto;
  const tam = texto.length > 26 ? 44 : texto.length > 18 ? 54 : 64;
  h.style.fontSize = tam + 'px';
  // Todo el nombre aparece junto (no letra por letra): desenfoque + el espacio entre letras se cierra
  h.animate([
    { opacity: 0, filter: 'blur(14px)', letterSpacing: '.22em', transform: 'translateY(14px)' },
    { opacity: 1, filter: 'blur(0)', letterSpacing: '0em', transform: 'none' }
  ], { duration: 1900, delay: 300, easing: ENTRA_SALE, fill: 'both' });
  $('subtitulo').style.animationDelay = '1.7s';
  // Un solo destello dorado al terminar, y después uno discreto cada 40 s
  const brillo = () => { try { h.animate([{ backgroundPosition: '150% 0' }, { backgroundPosition: '-50% 0' }], { duration: 1600, easing: 'ease-in-out', pseudoElement: '::after' }); } catch {} };
  setTimeout(brillo, 2500); setInterval(brillo, 40000);
}
function ponerFondos() {
  const v = (cfg.videoFondo || '').trim(), vid = $('fondo');
  if (!v) return;
  vid.src = ruta(v);
  vid.oncanplay = () => { vid.style.opacity = (cfg.opacidadFondo ?? 40) / 100; vid.play().catch(() => {}); };
}

async function iniciar() {
  cfg = await (await fetch('/api/config')).json();
  animarTitulo(cfg.evento); $('subtitulo').textContent = cfg.subtitulo || '';
  document.title = cfg.evento + ' · Seating';
  ponerFondos();
  $('qr').src = cfg.qr; $('url').textContent = cfg.urlMovil.replace(/^https?:\/\//, '');
  if (cfg.mensajes) { $('banner-t').textContent = 'Leave a wish ✍️'; $('banner-p').textContent = 'After finding your table, write a message with your finger'; }
  dibujar(); repartirMesas();
  await sincronizar();
}

const PASTEL = [
  ['#cfe5d2', '#a8c9ae', '#7fa98a'], ['#ffe0d2', '#f6bfa8', '#e09a80'], ['#fff1c6', '#f7d98f', '#e2b85c'], ['#dbe8f5', '#b3cbe3', '#8aa9c9'],
  ['#ffd2c4', '#f29b7f', '#d97558'], ['#f1e1f2', '#d9bfdc', '#b898bc'], ['#d9efe6', '#b9dccf', '#8fbfac'], ['#ffdfe5', '#f4b6c2', '#d98e9e']];
const colorMesa = n => PASTEL[(n - 1) % PASTEL.length];
// el QR (y su halo de luz) van donde se haya colocado en el editor
function ponerQR() {
  for (const id of ['qr-rombo', 'halo']) { const e = $(id); e.style.left = P.qr.x + 'px'; e.style.top = P.qr.y + 'px'; }
}
function dibujar() {
  P = calcularEscena(cfg.mesas, cfg.asientos, (cfg.posiciones || {})[DISENO]);
  ponerQR();
  const svg = $('mapa');
  svg.setAttribute('viewBox', `0 0 ${P.W} ${P.H}`);
  svg.innerHTML = `<defs>
    ${PASTEL.map((c, i) => `<radialGradient id="gP${i}" cx="35%" cy="28%" r="75%"><stop offset="0" stop-color="${c[0]}"/><stop offset=".62" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></radialGradient>`).join('')}
    <radialGradient id="gHueco" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#fffaf2"/><stop offset=".7" stop-color="#f6ecdf"/><stop offset="1" stop-color="#e8d8c4"/></radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sombra" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#7a583a" flood-opacity=".22"/></filter>
    <filter id="sombraS" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#7a583a" flood-opacity=".2"/></filter>
    <filter id="suave"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>`;
  const s = P.escala, fs = Math.max(6, P.rSilla * .66), R = P.R * 1.12;
  for (const m of P.mesas) {
    const ci = (m.numero - 1) % PASTEL.length;
    const g = el('g', { class: 'mesa', id: `mesa-${m.numero}`, filter: 'url(#sombra)' }, svg);
    el('circle', { class: 'mesa-base', cx: m.cx, cy: m.cy, r: R, fill: `url(#gP${ci})`, stroke: 'rgba(255,255,255,.7)', 'stroke-width': 2 }, g);
    el('ellipse', { cx: m.cx - R * .32, cy: m.cy - R * .5, rx: R * .42, ry: R * .17, fill: '#fff', opacity: .5, filter: 'url(#suave)', transform: `rotate(-20 ${m.cx - R * .32} ${m.cy - R * .5})` }, g);
    const nom = cfg.nombresMesas[m.numero];
    el('text', { class: 'mesa-et', x: m.cx, y: m.cy - 21 * s, 'font-size': 8 * s }, g).textContent = 'TABLE';
    el('text', { class: 'mesa-num', x: m.cx, y: m.cy + (nom ? -1 : 3) * s, 'font-size': 36 * s }, g).textContent = m.numero;
    if (nom) el('text', { class: 'mesa-nom', x: m.cx, y: m.cy + 22 * s, 'font-size': 10 * s }, g).textContent = nom.length > 14 ? nom.slice(0, 13) + '…' : nom;
    el('text', { class: 'mesa-cont', x: m.cx, y: m.cy + (nom ? 34 : 30) * s, id: `cont-${m.numero}`, 'font-size': 8 * s }, g).textContent = `0/${cfg.asientos}`;
    m.sillas.forEach((p, i) => {
      const sg = el('g', { class: 'silla', id: `s-${m.numero}-${i}`, filter: 'url(#sombraS)' }, svg);
      el('circle', { cx: p.x, cy: p.y, r: P.rSilla, fill: 'url(#gHueco)', stroke: 'rgba(255,255,255,.9)', 'stroke-width': 1.2, 'data-color': `url(#gP${ci})` }, sg);
      el('text', { x: p.x, y: p.y + .5, 'font-size': fs }, sg);
    });
  }
}

let mesasRepartidas = false;
async function repartirMesas() {
  if (mesasRepartidas) return; mesasRepartidas = true;
  let t = 700, paso = 230;
  for (const m of P.mesas) {
    const g = $(`mesa-${m.numero}`);
    g.animate([{ opacity: 0, transform: 'translateY(-34px) scale(.8)' }, { opacity: 1, transform: 'none' }],
      { duration: 640, delay: t, easing: SOBRE, fill: 'backwards' });
    m.sillas.forEach((_, j) => {
      const s = $(`s-${m.numero}-${j}`);
      s.animate([{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'none' }],
        { duration: 380, delay: t + 260 + j * 26, easing: SOBRE, fill: 'backwards' });
    });
    t += paso; paso = Math.max(70, paso * .8);   // cada mesa llega un poco antes que la anterior
  }
}

async function sincronizar() {
  const lista = await (await fetch('/api/estado')).json();
  for (const g of lista) if (!ocupados.has(g.id)) ocupar(g, false);
  if (cfg.mensajes) {
    const ms = await (await fetch('/api/mensajes')).json();
    for (const m of ms) if (!notas.has(m.id) || notas.get(m.id).m.hora !== m.hora) pegarNota(m, false);
  }
}

// ---------- mural de deseos ----------
// Una sola columna a la derecha que sube sin parar desde abajo.
// La tarjeta que pasa por el centro se agranda para poder leerla.
const notas = new Map();                 // id -> { m, el, s, vis }
const PASO = 122, VEL = 30, ZOOM = .42;  // separación (px), velocidad (px/s), cuánto crece la del centro
let pausaMural = false, ultimoT = 0;
const altoMural = () => $('mural').clientHeight;
const largoMural = () => Math.max(notas.size * PASO, altoMural() + PASO * 2);
function colocar(n, H) {
  const y = H + PASO / 2 - n.vis;                         // centro vertical de la tarjeta
  const d = Math.abs(y - H / 2), f0 = Math.max(0, 1 - d / (PASO * 1.7)), f = f0 * f0 * (3 - 2 * f0);
  n.el.style.transform = `translateY(${(y - 45).toFixed(1)}px) scale(${(1 + ZOOM * f).toFixed(3)})`;
  n.el.style.zIndex = Math.round(f * 100);
  n.el.style.visibility = (y < -PASO || y > H + PASO) ? 'hidden' : '';
  n.el.classList.toggle('centro', f > .85);
}
function pegarNota(m, nueva, enCentro) {
  quitarNota(m.id);
  const el = document.createElement('div'); el.className = 'slot';
  el.innerHTML = `<div class="nota${nueva ? ' nueva' : ''}" id="nota-${m.id}"><img src="${m.img}" alt=""><span>${esc(m.nombre)} · Table ${m.mesa}</span></div>`;
  $('mural').appendChild(el);
  const H = altoMural(); let s;
  if (enCentro) {
    s = H / 2 + PASO / 2;                                  // justo en el centro
    for (const o of notas.values()) if (o.s >= s - PASO / 2) o.s += PASO;   // los de arriba se corren para hacerle lugar
  } else {
    const todas = [...notas.values()];
    s = todas.length ? Math.min(...todas.map(o => o.s)) - PASO : H + PASO / 2 - 40;   // detrás del último
  }
  const n = { m, el, s, vis: s }; notas.set(m.id, n);
  const L = largoMural(); for (const o of notas.values()) { o.s = ((o.s % L) + L) % L; if (o === n) o.vis = o.s; }
  colocar(n, H);
  return el.firstElementChild;
}
function quitarNota(id) { const n = notas.get(id); if (n) { n.el.remove(); notas.delete(id); } }
function cuadroMural(t) {
  const dt = Math.min(.05, (t - ultimoT) / 1000 || 0); ultimoT = t;
  const H = altoMural(), L = largoMural();
  for (const n of notas.values()) {
    if (!pausaMural) n.s += VEL * dt;
    if (n.s >= L) { n.s -= L; n.vis = n.s; }
    n.vis += (n.s - n.vis) * Math.min(1, dt * 5);
    colocar(n, H);
  }
  requestAnimationFrame(cuadroMural);
}
requestAnimationFrame(cuadroMural);

async function animarMensaje(m) {
  const vol = $('volador'), inner = vol.querySelector('.in'), velo = $('velo');
  inner.innerHTML = `<div class="v-hola">A wish from</div><div class="v-mesa" style="font-size:clamp(28px,3vw,58px);font-style:normal;color:var(--marfil)">${esc(m.nombre)}</div><img class="v-deseo" src="${m.img}" alt="">`;
  await new Promise(ok => { const im = inner.querySelector('img'); im.complete ? ok() : (im.onload = im.onerror = ok); });
  vol.getAnimations().forEach(a => a.cancel());
  vol.animate([{ opacity: 1 }, { opacity: 1 }], { duration: 1, fill: 'forwards' });
  velo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, easing: EXPO, fill: 'forwards' });
  const [hola, quien, dibujo] = inner.children;
  await revelar([hola, dibujo, quien], 1);
  await sleep(cola.length >= 2 ? 1800 : 3200);
  pausaMural = true;
  const n = pegarNota(m, false, true); n.style.visibility = 'hidden';
  await sleep(700);   // deja que las demás tarjetas le hagan lugar
  const r = n.getBoundingClientRect();
  const dx = r.left + r.width / 2 - innerWidth / 2, dy = r.top + r.height / 2 - innerHeight / 2;
  velo.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1100, fill: 'forwards', delay: 200 });
  await vol.animate(arco(dx, dy, .2, 160), { duration: 1250, easing: ACELERA, fill: 'forwards' }).finished;
  n.style.visibility = '';
  await encajar(n);
  await sleep(1800); pausaMural = false;
}
// "row-embed": la tarjeta baja, se aplana y encaja; una costura de luz se abre desde el centro y se apaga
async function encajar(n) {
  const c = document.createElement('div'); c.className = 'costura'; n.appendChild(c);
  await n.animate([
    { opacity: 0, transform: 'perspective(700px) translateY(-46px) rotateX(18deg) scale(1.06)' },
    { opacity: 1, transform: 'perspective(700px) translateY(0) rotateX(0deg) scale(.995)', offset: .78 },
    { opacity: 1, transform: 'none' }], { duration: 560, easing: 'cubic-bezier(.2,.9,.3,1)' }).finished;
  await c.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 170, easing: 'cubic-bezier(.33,1,.68,1)', fill: 'forwards' }).finished;
  await c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 280, fill: 'forwards' }).finished;
  c.remove();
}

function ocupar(g, nueva) {
  ocupados.set(g.id, g);
  const s = $(`s-${g.mesa}-${g.asiento}`);
  if (s) {
    s.classList.add('ocupada'); s.querySelector('text').textContent = iniciales(g.nombre);
    const c = s.querySelector('circle'); c.setAttribute('fill', c.dataset.color); c.setAttribute('stroke', '#fff'); c.setAttribute('stroke-width', 2);
    if (nueva) { s.classList.remove('nueva'); void s.getBBox(); s.classList.add('nueva'); onda(s); }
  }
  const n = [...ocupados.values()].filter(x => x.mesa === g.mesa).length;
  const c = $(`cont-${g.mesa}`); if (c) c.textContent = `${n}/${cfg.asientos}`;
}
function onda(s) {
  const c = s.querySelector('circle');
  const o = el('circle', { class: 'onda', cx: c.getAttribute('cx'), cy: c.getAttribute('cy'), r: P.rSilla }, $('mapa'));
  o.animate([{ r: P.rSilla, opacity: 1 }, { r: P.rSilla * 4, opacity: 0 }], { duration: 1100, easing: 'ease-out' }).onfinish = () => o.remove();
}

function encolar(g) { if (ocupados.has(g.id) || cola.some(x => !x.tipo && x.id === g.id)) return; cola.push(g); if (!animando) procesar(); }
function encolarMensaje(m) { if (!cfg.mensajes || !m) return; cola.push({ ...m, tipo: 'mensaje' }); if (!animando) procesar(); }
async function procesar() {
  animando = true;
  while (cola.length) {
    const x = cola.shift();
    try { await (x.tipo === 'mensaje' ? animarMensaje(x) : animar(x)); }
    catch (e) { console.error(e); pausaMural = false; $('velo').getAnimations().forEach(a => a.cancel()); $('volador').getAnimations().forEach(a => a.cancel()); if (x.tipo === 'mensaje') pegarNota(x, true); else ocupar(x, true); }
  }
  animando = false;
}

// Trayectoria en arco (sube y luego baja a su destino), con el tamaño que se reduce al final
function arco(dx, dy, escalaFinal, alto = 240) {
  const cx = dx * .2, cy = Math.min(dy, 0) * .4 - alto, kf = [];
  for (let i = 0; i <= 16; i++) {
    const t = i / 16, u = 1 - t;
    const x = 2 * u * t * cx + t * t * dx, y = 2 * u * t * cy + t * t * dy;
    const sc = 1 - (1 - escalaFinal) * Math.pow(t, 1.5);
    kf.push({ transform: `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${sc.toFixed(3)})`, opacity: t > .9 ? Math.max(0, 1 - (t - .9) * 10) : 1 });
  }
  return kf;
}
// Revelado sincronizado del bloque central (hola / nombre / mesa / línea)
function revelar(partes, k) {
  const [hola, nombre, sub, linea] = partes, a = [];
  hola && a.push(hola.animate([{ opacity: 0, letterSpacing: '1.1em' }, { opacity: 1, letterSpacing: '.55em' }], { duration: 1000 * k, easing: EXPO, fill: 'backwards' }));
  nombre && a.push(nombre.animate([
    { opacity: 0, filter: 'blur(16px)', transform: 'translateY(38px) scale(.96)', letterSpacing: '.1em' },
    { opacity: 1, filter: 'blur(0)', transform: 'none', letterSpacing: '0em' }], { duration: 1150 * k, delay: 120 * k, easing: EXPO, fill: 'backwards' }));
  sub && a.push(sub.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 750 * k, delay: 420 * k, easing: EXPO, fill: 'backwards' }));
  linea && a.push(linea.animate([{ transform: 'scaleX(0)', opacity: 0 }, { transform: 'scaleX(1)', opacity: 1 }], { duration: 850 * k, delay: 560 * k, easing: EXPO, fill: 'backwards' }));
  return Promise.all(a.map(x => x.finished));
}
// La luz parte del QR, pasa por un punto intermedio y se fija en la mesa (con un pequeño pulso)
function focoA(x, y, k) {
  const f = $('foco');
  f.getAnimations().forEach(a => a.cancel());
  const mx = P.qr.x + (x - P.qr.x) * .45 + (y < P.qr.y ? 60 : -60), my = P.qr.y + (y - P.qr.y) * .35;
  f.animate([
    { opacity: 0, '--fx': P.qr.x + 'px', '--fy': P.qr.y + 'px', '--fr': 1.5 },
    { opacity: 1, '--fx': mx + 'px', '--fy': my + 'px', '--fr': 1.25, offset: .45 },
    { opacity: 1, '--fx': x + 'px', '--fy': y + 'px', '--fr': .92, offset: .85 },
    { opacity: 1, '--fx': x + 'px', '--fy': y + 'px', '--fr': 1 }
  ], { duration: 1500 * k, easing: ENTRA_SALE, fill: 'forwards' });
}
function focoFuera(k) {
  const f = $('foco'), cs = getComputedStyle(f);
  f.animate([{ opacity: 1, '--fx': cs.getPropertyValue('--fx'), '--fy': cs.getPropertyValue('--fy'), '--fr': 1 },
             { opacity: 0, '--fx': cs.getPropertyValue('--fx'), '--fy': cs.getPropertyValue('--fy'), '--fr': 1.6 }],
    { duration: 900 * k, easing: EXPO, fill: 'forwards' });
}
// La mesa se eleva con rebote, un haz de luz le da dos vueltas (rápida y luego lenta) y se vuelve a asentar
async function levantarMesa(numero, k) {
  const g = $(`mesa-${numero}`), m = P.mesas[numero - 1]; if (!g || !m) return;
  g.classList.add('activa');
  const dur = 2300 * k;
  const sube = g.animate([
    { transform: 'scale(1)', easing: SOBRE },
    { transform: 'scale(1.15)', offset: .16, easing: 'ease-in-out' },
    { transform: 'scale(1.12)', offset: .45, easing: 'ease-in-out' },
    { transform: 'scale(1.15)', offset: .72, easing: 'cubic-bezier(.5,0,.6,1)' },
    { transform: 'scale(.985)', offset: .92, easing: 'ease-out' },
    { transform: 'scale(1)' }], { duration: dur });
  const rr = P.R * 1.12 * 1.15 + 8;
  const vuelta = (ancho, op, ms, retraso) => {
    const glow = el('circle', { class: 'haz', cx: m.cx, cy: m.cy, r: rr, pathLength: 1, 'stroke-dasharray': '0.16 1', stroke: colorMesa(numero)[1], 'stroke-width': ancho * 2.6, opacity: 0, filter: 'url(#brillo)' }, $('mapa'));
    const core = el('circle', { class: 'haz', cx: m.cx, cy: m.cy, r: rr, pathLength: 1, 'stroke-dasharray': '0.16 1', stroke: colorMesa(numero)[2], 'stroke-width': ancho, opacity: 0 }, $('mapa'));
    return Promise.all([[glow, op * .45], [core, op]].map(([c, o]) => c.animate([
      { strokeDashoffset: 0, opacity: 0 }, { opacity: o, offset: .12 }, { opacity: o, offset: .82 }, { strokeDashoffset: -1, opacity: 0 }],
      { duration: ms, delay: retraso, easing: 'cubic-bezier(.4,0,.3,1)' }).finished.then(() => c.remove())));
  };
  await Promise.all([sube.finished, vuelta(3.2, 1, 650 * k, 280 * k), vuelta(2, .6, 900 * k, 960 * k)]);
  g.classList.remove('activa');
}

async function animar(g) {
  const prisa = cola.length >= 2, k = prisa ? .6 : 1;
  const vol = $('volador'), inner = vol.querySelector('.in'), velo = $('velo');
  const nomMesa = cfg.nombresMesas[g.mesa] ? ` · ${esc(cfg.nombresMesas[g.mesa])}` : '';
  inner.innerHTML = `<div class="v-hola">Welcome</div><div class="v-nombre">${esc(g.nombre)}</div><div class="v-mesa" style="background:linear-gradient(180deg,${colorMesa(g.mesa)[0]},${colorMesa(g.mesa)[1]})">Table ${g.mesa}${nomMesa}</div><div class="v-linea"></div>`;
  vol.getAnimations().forEach(a => a.cancel());
  vol.animate([{ opacity: 1 }, { opacity: 1 }], { duration: 1, fill: 'forwards' });
  const mesa = P.mesas[g.mesa - 1];
  // 1) Entrada: el nombre completo aparece de golpe (sincronizado), sobre un velo oscuro
  velo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600 * k, easing: EXPO, fill: 'forwards' });
  await revelar([...inner.children], k);
  // 2) Pausa para leer (≥1 s); mientras tanto la luz busca la mesa
  if (mesa) focoA(mesa.cx, mesa.cy, k);
  await sleep(prisa ? 750 : 1400);
  // 3) Vuelo en arco hacia su asiento: arranca suave y acelera
  const destino = $(`s-${g.mesa}-${g.asiento}`) || $(`mesa-${g.mesa}`);
  const r = destino.getBoundingClientRect();
  const dx = r.left + r.width / 2 - innerWidth / 2, dy = r.top + r.height / 2 - innerHeight / 2;
  velo.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1000 * k, delay: 150 * k, easing: ENTRA_SALE, fill: 'forwards' });
  await vol.animate(arco(dx, dy, .06), { duration: 1300 * k, easing: ACELERA, fill: 'forwards' }).finished;
  // 4) Aterriza: el asiento se enciende y la mesa se eleva, recibe el haz y se asienta
  ocupar(g, true);
  await levantarMesa(g.mesa, k);
  focoFuera(k);
  await sleep(250 * k);
}


// bokeh: luces suaves alrededor del QR que destellan con cada pulso
function crearBokeh() {
  const halo = $('halo');
  for (let i = 0; i < 26; i++) {
    const ang = Math.random() * Math.PI * 2, rad = 270 + Math.random() * 110;
    const tam = 9 + Math.random() * 15, c = PASTEL[i % PASTEL.length];
    const b = document.createElement('div'); b.className = 'bokeh';
    b.style.cssText = `left:${Math.cos(ang) * rad * 1.1 - tam / 2}px;top:${Math.sin(ang) * rad - tam / 2}px;width:${tam}px;height:${tam}px;` +
      `--d:${5 + Math.random() * 6}s;--x:${(Math.random() - .5) * 30}px;--y:${(Math.random() - .5) * 30}px`;
    b.innerHTML = `<i style="--c:${c[1]};--c2:${c[2]};--r:${((rad - 270) / 110 * .35).toFixed(2)}s"></i>`;
    halo.appendChild(b);
  }
}
crearBokeh();

// ---- tiempo real ----
const socket = io();
socket.on('llegada', encolar);
socket.on('mensaje', encolarMensaje);
socket.on('mensaje-borrado', d => quitarNota(d.id));
socket.on('reinicio', () => location.reload());
socket.on('connect', () => { $('conexion').style.display = 'none'; if (cfg) sincronizar(); });
socket.on('disconnect', () => { $('conexion').style.display = 'block'; });

// ---- teclado ----
let demoN = 0;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (k === 'd') {
    const m = 1 + Math.floor(Math.random() * cfg.mesas);
    const libres = [...Array(cfg.asientos).keys()].filter(i => ![...ocupados.values()].some(x => x.mesa === m && x.asiento === i));
    if (!libres.length) return;
    encolar({ id: 'demo' + (++demoN), nombre: ['Test Guest', 'Emily Carter', 'James Walker', 'Sophia Bennett'][demoN % 4], mesa: m, asiento: libres[0], hora: Date.now() });
  }
});
setTimeout(() => $('ayuda').style.opacity = 0, 8000);
if ('wakeLock' in navigator) { const pedir = () => navigator.wakeLock.request('screen').catch(() => {}); pedir(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && pedir()); }

iniciar();
</script>
